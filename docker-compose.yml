services:
  dasturlash-ai-bot:
    build: .
    container_name: dasturlash-ai-control-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/bot.sqlite3
      TZ: Asia/Tashkent
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    init: true
